<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>LayerCraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family: monospace;overflow-x:hidden}

/* FUNDO PRETO E BRANCO COM DETALHES */
body::before{
  content:"";position:fixed;top:0;left:0;width:100%;height:100%;
  background: 
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index:-1;
}
body::after{
  content:"";position:fixed;top:0;left:0;width:100%;height:100%;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 70%);
  z-index:-1;
}

/* TELA DE RECEPÇÃO */
#recepcao{
  height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  animation: fadeIn 1s;
}
#recepcao h1{font-size:60px;font-weight:900;letter-spacing:8px}
#recepcao h1 span{color:#fff;text-shadow: 0 0 20px #fff;}
#recepcao p{color:#888;margin-top:10px;letter-spacing:3px}

.modos{display:flex;gap:20px;margin-top:40px;flex-wrap:wrap;justify-content:center}

.btn-modo{
  width:200px;height:120px;background:#111;border:1px solid #222;
  border-radius:16px;cursor:pointer;position:relative;overflow:hidden;
  transition:0.3s;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
}
.btn-modo b{font-size:16px;letter-spacing:2px}
.btn-modo small{color:#666;font-size:11px}
