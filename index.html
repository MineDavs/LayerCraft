
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAYERCRAFT by MineDevs</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151b;color:white;font-family:Arial,sans-serif}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#172c27,#182333)}
.logo{font-size:clamp(30px,8vw,54px);font-weight:900;letter-spacing:2px;color:#7df5a2;animation:entrada 1s ease}
@keyframes entrada{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
header p{color:#c1d3cc}
main{max-width:950px;margin:auto;padding:18px}
h2{color:#7df5a2}
select,button{padding:12px;border:0;border-radius:9px;font-size:15px}
select{background:#26343e;color:white;width:100%;margin:8px 0}
button{background:#70e89a;color:#102017;font-weight:bold;cursor:pointer;margin:4px}
button:active{transform:scale(.97)}
.painel{background:#19232c;padding:16px;border-radius:14px;margin:16px 0}
#cena{height:320px;background:#101820;border-radius:12px;overflow:hidden}
.botoes{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
#materiais{line-height:1.9;color:#d9e6df}
footer{text-align:center;padding:25px;color:#8d9e95}
</style>
</head>
<body>
<header>
  <div class="logo">LAYERCRAFT</div>
  <p>by MineDevs · Construa bloco por bloco</p>
  <button onclick="document.getElementById('construtor').scrollIntoView({behavior:'smooth'})">Começar a construir</button>
</header>

<main id="construtor">
  <section class="painel">
    <h2>Escolha sua construção</h2>
    <select id="construcao" onchange="iniciar()">
      <option value="casa">Casa de madeira</option>
      <option value="torre">Torre de pedra</option>
      <option value="farm">Farm de plantação</option>
    </select>
    <div id="cena"></div>
    <p id="info">Carregando construção...</p>
    <div class="botoes">
      <button onclick="mudar(-1)">← Camada anterior</button>
      <button onclick="mudar(1)">Próxima camada →</button>
      <button onclick="mostrarTudo()">Mostrar tudo</button>
    </div>
    <h2>Materiais desta camada</h2>
    <div id="materiais"></div>
  </section>
</main>
<footer>LAYERCRAFT by MineDevs · Feito para jogadores de Minecraft</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const cena=document.getElementById('cena');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(cena.clientWidth,cena.clientHeight);
renderer.setClearColor(0x101820);
cena.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101820);
const camera=new THREE.PerspectiveCamera(45,cena.clientWidth/cena.clientHeight,0.1,1000);
camera.position.set(9,8,11);
scene.add(new THREE.HemisphereLight(0xffffff,0x64745d,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,7);scene.add(light);

const group=new THREE.Group();scene.add(group);
const geo=new THREE.BoxGeometry(1,1,1);
const mats={
madeira:new THREE.MeshLambertMaterial({color:0x986438}),
folha:new THREE.MeshLambertMaterial({color:0x3c9b45}),
pedra:new THREE.MeshLambertMaterial({color:0x858b91}),
vidro:new THREE.MeshLambertMaterial({color:0x80d9ee,transparent:true,opacity:.55}),
terra:new THREE.MeshLambertMaterial({color:0x79502e}),
agua:new THREE.MeshLambertMaterial({color:0x328ee0}),
telha:new THREE.MeshLambertMaterial({color:0x573b2b}),
grama:new THREE.MeshLambertMaterial({color:0x62ad43})
};
let blocos=[],nivel=0,maxNivel=0,arrastando=false,px=0,py=0;

function adicionar(x,y,z,tipo){
 const mesh=new THREE.Mesh(geo,mats[tipo]||mats.pedra);
 mesh.position.set(x,y,z);mesh.userData.nivel=y;
 group.add(mesh);blocos.push(mesh);
}
function iniciar(){
 group.clear();blocos=[];nivel=0;
 const tipo=document.getElementById('construcao').value;
 if(tipo==='casa'){
  for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)adicionar(x,0,z,'terra');
  for(let y=1;y<=3;y++)for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++){
   if(x===-2||x===2||z===-2||z===2){
    let material=(y===2&&(x===-2||x===2)&&(z===0))?'vidro':'madeira';
    if(y===1&&x===0&&z===-2)continue;
    adicionar(x,y,z,material);
   }
  }
  for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)
   if(Math.abs(x)+Math.abs(z)<=5)adicionar(x,4,z,'telha');
  maxNivel=4;
 }else if(tipo==='torre'){
  for(let y=0;y<=7;y++){
   for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)
    if(x===-2||x===2||z===-2||z===2)adicionar(x,y,z,'pedra');
   if(y===0)for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)adicionar(x,y,z,'terra');
  }
  for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)
   if(Math.abs(x)===3||Math.abs(z)===3)adicionar(x,8,z,'pedra');
  maxNivel=8;
 }else{
  for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)adicionar(x,0,z,'terra');
  for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)
   if((x+z)%2===0&&Math.abs(x)<3&&Math.abs(z)<3)adicionar(x,1,z,'grama');
  for(let z=-3;z<=3;z++)adicionar(0,1,z,'agua');
  maxNivel=1;
 }
 atualizar();
}
function atualizar(){
 blocos.forEach(b=>b.visible=b.userData.nivel<=nivel);
 document.getElementById('info').textContent=
 'Camada '+(nivel+1)+' de '+(maxNivel+1);
 const visiveis=blocos.filter(b=>b.userData.nivel===nivel);
 const contagem={};
 visiveis.forEach(b=>{
  const nome=Object.keys(mats).find(k=>mats[k]===b.material)||'bloco';
  contagem[nome]=(contagem[nome]||0)+1;
 });
 document.getElementById('materiais').innerHTML=
 Object.entries(contagem).map(([n,q])=>q+' × '+n).join('<br>')||'Nenhum bloco nesta camada';
}
function mudar(n){nivel=Math.max(0,Math.min(maxNivel,nivel+n));atualizar()}
function mostrarTudo(){nivel=maxNivel;atualizar()}
renderer.domElement.addEventListener('pointerdown',e=>{arrastando=true;px=e.clientX;py=e.clientY});
window.addEventListener('pointerup',()=>arrastando=false);
window.addEventListener('pointermove',e=>{
 if(!arrastando)return;
 group.rotation.y+=(e.clientX-px)*.01;
 group.rotation.x+=(e.clientY-py)*.01;
 px=e.clientX;py=e.clientY;
});
renderer.domElement.addEventListener('wheel',e=>{
 camera.position.multiplyScalar(e.deltaY>0?1.1:.9);
});
function animar(){requestAnimationFrame(animar);renderer.render(scene,camera)}
function redimensionar(){
 const w=cena.clientWidth,h=cena.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
window.addEventListener('resize',redimensionar);
camera.lookAt(0,3,0);
iniciar();animar();
</script>
</body>
</html>
